server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://db.wiwevnqszfmgowdwspsi.supabase.co:5432/postgres?sslmode=require&currentSchema=public
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:your_supabase_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    default-schema: public
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTSigningThatIsAtLeast256BitsLongForHS256Algorithm}
    access-token-expiration: 1800000
    refresh-token-expiration: 604800000
  file:
    upload-dir: ./uploads
  cors:
    allowed-origins: http://localhost:5173

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.iicmr.eduportal: DEBUG
    org.springframework.security: WARN
